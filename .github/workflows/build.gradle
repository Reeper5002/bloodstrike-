name: Build AimBot
on: [workflow_dispatch, push]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Find project and build APK
        run: |
          SETTINGS="$(find . -name 'settings.gradle' | head -n 1)"
          if [ -z "$SETTINGS" ]; then
            echo "!!! settings.gradle NOT FOUND ANYWHERE !!!"
            echo "Repo contains:"
            find . -type f | head -50
            exit 1
          fi
          ROOT="$(dirname "$SETTINGS")"
          echo "Building from: $ROOT"
          echo "PROJECT_DIR=$ROOT" >> "$GITHUB_ENV"
          cd "$ROOT"
          gradle assembleDebug --no-daemon

      - name: Publish to Releases
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: aimbot-latest
          files: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
